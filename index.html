<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles.css" />
    <title>AI Poem Generator</title>
</head>
<body>
    <header>
        <h1>AI Poem Generator</h1>
    </header>
    <main>
        <form>
            <input type="text" placeholder="Enter the topic of the poem" 
            autofocus 
            required 
            autocomplete="off"
            />
            <input type="submit" />
        </form>
        <div>
            I’m Yertle the Turtle!
            <br />
            Oh, marvelous me!
        </div>
    </main>

    <footer> This AI project was coded by Bayleigh Martin and is 
    <a href="https://github.com/smartinnni/Poem-Generator" target="_blank" > 
        open-sourced on GitHub 

    </a>   
    and is 
    <a href="https://aipoem-generator1.netlify.app/" target="_blank">
        hosted on Netlify </a>
    </footer>

    <script src="index.js"></script>
</body>
</html>
